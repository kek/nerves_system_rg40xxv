name: CI

on:
  push:
  pull_request:

# A from-scratch Buildroot build takes the better part of an hour, so pushes
# arriving faster than that used to stack up runs that were already superseded
# -- four were queued at once during bring-up. Only the newest ref matters.
#
# Except on trunk. Since the Buildroot patch is applied here (see "Build the
# system" below) the build also compiles host LLVM, host clang and host-mesa3d,
# none of which the old 1h33m green builds compiled at all -- plausibly 2.5-3h.
# Cancelling that on every push means the GPU assertion at the end of the job
# essentially never runs, which is the same silent-green failure mode in a new
# costume. Branches and tags keep the old behaviour; trunk builds are allowed
# to finish and queue behind each other.
#
# This is set per job rather than for the whole workflow, and the two groups
# are named differently on purpose. A workflow-level block would apply the
# trunk exemption to the cheap checks job as well -- so superseded lint runs
# would sit in the queue behind a three-hour build, which is the opposite of
# why that job was split out. Sharing one group name would be worse still:
# the jobs would cancel each other.

env:
  OTP_VERSION: "29.0.4"
  ELIXIR_VERSION: "1.20.2-otp-29"
  NERVES_BOOTSTRAP_VERSION: "1.17.0"
  KERNEL_VERSION: "6.18.44"

# Read by default; the one job that publishes asks for more. This repository's
# default workflow permission is "read", which is why every tag build failed at
# the release step with
#
#     Found release v0.2.0 — udev (with id=371435425)
#     HttpError: Resource not accessible by integration
#
# -- action-gh-release found the release and was refused permission to attach
# assets to it. The identical commit passed on trunk because that step is
# gated on refs/tags/v and never ran there, which is the whole reason the
# failure looked like it was about tags.
#
# Declared here rather than by flipping the repository setting: this way it is
# visible in the tree, reviewable, and survives the repo being recreated.
permissions:
  contents: read

jobs:
  # Cheap checks that catch the failures which would otherwise only show up
  # after flashing a card. Deliberately separate from the system build so
  # they report in a couple of minutes rather than an hour.
  checks:
    runs-on: ubuntu-latest
    # Always cancel superseded runs: this job is minutes long and only the
    # newest commit's result is interesting, on trunk as much as anywhere.
    concurrency:
      group: ${{ github.workflow }}-checks-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      build_needed: ${{ steps.scope.outputs.build_needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed by the scope step below, which diffs against the previous
          # tip. The default depth of 1 has no previous tip to diff against.
          fetch-depth: 0

      - name: Decide whether the system needs rebuilding
        id: scope
        # A push that changes nothing in checksum_files() cannot produce a
        # different artifact, so building is three and a half hours spent
        # confirming a byte-identical result.
        #
        # This used to ask a narrower question -- "did anything outside
        # .github/ change?" -- which was the same idea applied to one directory
        # instead of to the real list. It meant a documentation-only push still
        # cost a full build, which defeated the point of keeping docs/ out of
        # the checksum in the first place. build-needed.sh asks the actual
        # question, and reads the list out of mix.exs so there is no second
        # copy to drift.
        #
        # This was not safe to skip at all before the checkers grew self-tests.
        # The scripts under .github/scripts/ are what assert the image is
        # correct, and an untested change to one had to be exercised by a real
        # build -- which is exactly how a broken checker survived to fail run
        # 32008727891 after 3h24m. They now test themselves in this job in
        # about a second, so the build is no longer the only thing behind them.
        #
        # Deliberately conservative: anything it cannot work out safely
        # -- a tag, a force push, a first push on a branch, a missing or
        # unreachable base commit -- builds. The failure mode of guessing wrong
        # in that direction is a slow run; guessing wrong the other way is
        # shipping an unverified image.
        run: |
          needed=true
          why="not a plain branch push, so building to be safe"

          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" != "tag" ]; then
            before='${{ github.event.before }}'
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              why="no previous tip (new branch or force push), so building to be safe"
            elif ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
              why="previous tip $before is not in this clone, so building to be safe"
            else
              changed=$(git diff --name-only "$before" "${{ github.sha }}")
              echo "changed files:"
              echo "$changed" | sed 's/^/  /'
              echo
              # The reason goes to stderr, so keep it rather than letting it
              # scroll past as the only record of why a build was skipped.
              # A failure of the script itself falls back to building.
              if ! needed=$(printf '%s\n' "$changed" \
                   | .github/scripts/build-needed.sh mix.exs 2>/tmp/scope-why); then
                needed=true
                why="build-needed.sh failed, so building to be safe"
              else
                why=$(cat /tmp/scope-why)
              fi
            fi
          fi

          echo "build_needed=$needed" >> "$GITHUB_OUTPUT"
          echo
          echo "build_needed=$needed -- $why"

      # One version, one tag, one release, one artifact.
      #
      # `mix deps.get` resolves against `v$VERSION`, never against the tag, so
      # a tag that disagrees with VERSION publishes to a release nothing will
      # ever query -- green step, asset present, and every application still
      # falling through to a three-and-a-half-hour build. That happened for
      # v0.2.0, v0.3.0 and v0.4.0, and was invisible from this end.
      #
      # Rather than teach people the difference, this asserts there is none.
      # It runs in the cheap job so a mismatched tag costs a minute instead of
      # most of an afternoon, and it is the reason VERSION can be trusted to
      # mean something again.
      - name: Verify the tag matches VERSION
        if: github.ref_type == 'tag'
        run: |
          version=$(cat VERSION)
          tag='${{ github.ref_name }}'
          echo "VERSION: $version"
          echo "tag:     $tag"
          if [ "$tag" != "v$version" ]; then
            echo
            echo "Tag '$tag' does not match VERSION '$version'."
            echo "Bump VERSION in the commit you are tagging, so that the tag,"
            echo "the release deps.get queries, and the artifact filename all"
            echo "say the same thing. VERSION is bumped in the commit that gets tagged."
            exit 1
          fi
          echo "ok: tag and VERSION agree"

      - name: Verify the image layout is self-consistent
        run: tools/check-consistency.sh

      # REUSE.toml is maintained by hand, and hand-maintained metadata drifts
      # silently: nothing in a build fails when a licence text is missing or a
      # new directory is uncovered. An audit found four such drifts at once --
      # BSD-2-Clause referenced by the board DTS with no text in LICENSES/,
      # `patches/**` aggregating SPDX tags out of patch payloads, our own
      # Buildroot patches attributed to kernel contributors, and an unused
      # licence text.
      #
      # It belongs in this job rather than in `mix precommit`, because `reuse`
      # is a Python tool and not a dependency of this project. Seconds to run,
      # and it cannot trigger a rebuild.
      - name: Verify the licensing metadata is complete
        run: |
          pipx install reuse
          reuse lint

      - name: Verify the board device tree
        run: tools/check-dts.sh "$KERNEL_VERSION"

      - name: Test the build-scope checker itself
        # It decides whether a three-and-a-half-hour build runs, and its
        # dangerous answer is "false" -- a skipped build is an unverified image,
        # and the skip looks exactly like a pass. Same reasoning as the GPU
        # checker's self-test below, same second of runtime.
        run: .github/scripts/build-needed-selftest.sh

      - name: Test the DRAM type decoders themselves
        # tools/dram-type.sh is what settles LPDDR3 vs LPDDR4, and the answer
        # it produces gets written into a defconfig whose wrong value makes the
        # SoC unresponsive. A decoder that mis-parses would be confidently
        # wrong, so it is tested against synthesised boot0 images -- including
        # a corrupted one and one with LPDDR4's mode registers, which it must
        # refuse rather than decode.
        run: tools/dram-type.sh selftest

      - name: Test the GPU stack checker itself
        # The checker runs as the last step of a 3.5 hour job, so a one-line
        # shell mistake in it costs 3.5 hours to find. That happened twice in
        # one day -- run 32008727891 built a correct system for 3h24m and then
        # failed on the checker, and confirming the fix cost another full
        # build. None of that needed a build: the checker needs a directory of
        # the right shape, and this makes several in about a second.
        #
        # Verified to catch the actual bug: with the pipe reintroduced, this
        # reports 4 failures including the exact one that broke that run.
        run: .github/scripts/check-gpu-stack-selftest.sh

      - name: Verify the kernel defconfig is in sync with nerves.fragment
        run: |
          tools/gen-kernel-defconfig.sh "$KERNEL_VERSION"
          if ! git diff --exit-code -- linux/; then
            echo
            echo "linux/linux-*.defconfig is out of sync with linux/nerves.fragment."
            echo "Run tools/gen-kernel-defconfig.sh and commit the result."
            exit 1
          fi

  # There is deliberately no separate lint job. mix nerves.system.lint cannot
  # run without a built system: in the system's own repository Nerves.Env
  # insists on a real NERVES_SYSTEM directory, and tolerates a missing one only
  # when the system is a path dependency of some other project. So the old lint
  # job spent 1h6m building the whole of Buildroot before it could lint one
  # text file -- the build was load-bearing, not incidental -- and duplicated
  # what build-system already does. Neither NERVES_ENV_DISABLED nor pointing
  # NERVES_SYSTEM at an empty directory avoids it; the first trades the hour
  # for "path which does not exist" and the second for "the system hasn't been
  # built!". The linter therefore runs as a step of build-system below, where a
  # system exists and it costs about a second.
  #
  # The consequence is that the defconfig is linted on trunk and tags but not
  # on branches. That is the same trade build-system already makes, and the
  # invariants that actually break an image -- partition offsets, the U-Boot
  # environment location, the DTB name, the panel firmware -- are asserted by
  # tools/check-consistency.sh in the checks job on every push.

  build-system:
    # Building Buildroot from scratch takes three and a half hours, so only do
    # it where the result is worth having: on trunk and on tags, and not when
    # the push cannot have changed the image. See the scope step in `checks`
    # for how that last part is decided and why it errs towards building.
    if: >-
      (github.ref == 'refs/heads/trunk' || github.ref_type == 'tag') &&
      needs.checks.outputs.build_needed == 'true'
    needs: [checks]
    runs-on: ubuntu-latest
    # The only job that writes anything. Needed by the release step at the
    # bottom, which attaches the system artifact to the tag's release.
    permissions:
      contents: write
    # Let trunk builds finish. See the note at the top of the file: cancelling
    # these means the GPU assertion at the end never runs.
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        # A Buildroot output tree does not fit next to everything the hosted
        # runner image preinstalls.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            automake bc build-essential cmake cpio curl git libncurses5-dev \
            libssl-dev pkg-config squashfs-tools unzip wget

      - name: Install Nerves tooling
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix archive.install hex nerves_bootstrap "$NERVES_BOOTSTRAP_VERSION" --force

      # Buildroot re-downloads every source tarball on a cold runner, and the
      # upstream mirrors are not reliable: run 31912977472 failed with a 502
      # from gitlab.freedesktop.org followed by 403s from both dl.nerves-project.org
      # fallbacks while fetching evtest 1.36, and went green again on the next
      # push with no repo change in between. A warm ~/.nerves/dl does not fix
      # that class of failure -- nothing in this repo can -- but it removes
      # most of the exposure to it. create-build.sh symlinks Buildroot's dl/
      # here, so this is the whole download cache.
      - name: Cache Buildroot downloads
        uses: actions/cache@v4
        with:
          path: ~/.nerves/dl
          key: nerves-dl-${{ runner.os }}-${{ hashFiles('nerves_defconfig', 'mix.lock') }}
          restore-keys: |
            nerves-dl-${{ runner.os }}-

      - name: Cache the compiler cache
        # Aimed at host-llvm and host-clang: 88 minutes of a 3h22m build,
        # recompiling identical sources every run. See the note on BR2_CCACHE
        # in nerves_defconfig for why they cannot simply be dropped.
        #
        # The key includes a hash of nerves_defconfig, and that is the safety
        # interlock rather than mere cache hygiene. Buildroot does not
        # invalidate ccache when the compiler changes, and the external
        # toolchain URL lives in that file -- so a toolchain bump changes the
        # hash and starts from an empty cache instead of a poisoned one.
        #
        # github.sha makes every run miss on the exact key and therefore save a
        # fresh entry, while restore-keys warms it from the most recent run of
        # the same defconfig. That is the standard ccache-on-Actions shape:
        # actions/cache only writes when the primary key missed.
        uses: actions/cache@v4
        with:
          path: ~/.buildroot-ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('nerves_defconfig') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ hashFiles('nerves_defconfig') }}-

      - name: Build the system
        # `mix compile` applies patches/buildroot/ to Buildroot itself; see the
        # compiler in mix.exs, so there is nothing to do here beyond building.
        # The patch that matters most is the mesa3d one: without it Kconfig
        # silently drops BR2_PACKAGE_MESA3D_GALLIUM_DRIVER_PANFROST, and the
        # build still succeeds, with a Mesa that has no GBM and no kmscube. The
        # next step asserts against the built image rather than trusting the
        # .config, which is what catches that.
        run: |
          mix deps.get
          mix compile

      # Assert against the image, not the configuration. The verification plan
      # records the lesson the hard way: .config said the build was correct
      # while the artifact was not. See the script for what each check buys.
      - name: Verify the built image actually contains the GPU stack
        id: system
        # Look in both places a system can end up, because `mix compile` does
        # not always build one.
        #
        # `mix deps.get` downloads a prebuilt artifact whenever artifact_sites
        # has one matching the package checksum, and then nothing is built and
        # .nerves/artifacts never appears. That is not an edge case: it is what
        # happens on a re-run, and on any tag pointing at a commit that has
        # already been released. Runs 31969880128 (v0.1.0) and 31970043185 both
        # failed here with "found 0" for exactly that reason -- red for a cause
        # with nothing to do with the GPU.
        #
        # Checking the downloaded artifact instead is the better answer, not a
        # concession: those are the bytes that get flashed. A fresh build shows
        # the tree can produce a good image; the artifact shows the published
        # one is a good image. The script handles both layouts and says which
        # it found.
        run: |
          shopt -s nullglob
          built=(.nerves/artifacts/nerves_system_rg40xxv-portable-*/)
          fetched=("$HOME"/.nerves/artifacts/nerves_system_rg40xxv-portable-*/)

          if [ ${#built[@]} -eq 1 ]; then
            echo "Built from source this run."
            echo "source=built" >> "$GITHUB_OUTPUT"
            .github/scripts/check-gpu-stack.sh "${built[0]%/}" build.log
          elif [ ${#fetched[@]} -eq 1 ]; then
            echo "No local build tree: mix deps.get resolved a published artifact"
            echo "for this checksum, so nothing was compiled. Checking the artifact"
            echo "that would ship instead."
            echo "source=fetched" >> "$GITHUB_OUTPUT"
            .github/scripts/check-gpu-stack.sh "${fetched[0]%/}"
          else
            echo "Found no system to check: ${#built[@]} build tree(s) under" \
                 ".nerves/artifacts and ${#fetched[@]} artifact(s) under" \
                 "~/.nerves/artifacts. Expected exactly one of either."
            ls -la .nerves/artifacts "$HOME/.nerves/artifacts" 2>&1 || true
            exit 1
          fi

      # Assert which compiler actually built the image, not which one the
      # defconfig asked for. tools/check-consistency.sh already checks the
      # input -- that BR2_TOOLCHAIN_EXTERNAL_CUSTOM=y backs the CUSTOM_* lines
      # -- but Kconfig resolving a choice is exactly the step that went wrong
      # here for every build up to v0.5.0, so the outcome is worth reading off
      # the built config too. Well-formed input is not the same as a correct
      # result; that lesson is written all over this repository.
      #
      # Both layouts carry .config at their root: a build tree and a downloaded
      # artifact alike, which is how nerves-env.sh finds a system at all.
      - name: Verify which toolchain built the image
        run: |
          shopt -s nullglob
          dirs=(.nerves/artifacts/nerves_system_rg40xxv-portable-*/ \
                "$HOME"/.nerves/artifacts/nerves_system_rg40xxv-portable-*/)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "No system directory found to check."; exit 1
          fi
          config="${dirs[0]%/}/.config"
          if [ ! -f "$config" ]; then
            echo "No .config in ${dirs[0]}"; exit 1
          fi

          provides=$(sed -n 's/^BR2_PACKAGE_PROVIDES_TOOLCHAIN_EXTERNAL="\(.*\)"$/\1/p' "$config")
          prefix=$(sed -n 's/^BR2_TOOLCHAIN_EXTERNAL_PREFIX="\(.*\)"$/\1/p' "$config")
          echo "toolchain: $provides"
          echo "prefix:    $prefix"

          if [ "$provides" != "toolchain-external-custom" ]; then
            echo
            echo "The image was built by '$provides', not the Nerves toolchain."
            echo "Buildroot's toolchain choice defaults to the architecture's"
            echo "vendor toolchain, so this is what a missing"
            echo "BR2_TOOLCHAIN_EXTERNAL_CUSTOM=y looks like from the far end."
            exit 1
          fi
          case "$prefix" in
            *-nerves-linux-*) echo "ok: built with the Nerves toolchain" ;;
            *) echo "Unexpected toolchain prefix '$prefix'."; exit 1 ;;
          esac

      # build.log is Buildroot's '>>>' progress stream, written by mix compile.
      # It is the only place the ordering of package builds is visible after
      # the fact, and it is what the check above greps for host-mesa3d and
      # kmscube -- keep it whether or not the job passed.
      - name: Report the compiler cache hit rate
        if: always()
        # Without this, "we added ccache" is a claim rather than a measurement.
        # A first run on a cold cache is expected to be nearly all misses and
        # slightly slower than no ccache at all; the run after it is the one
        # that should show the difference.
        run: |
          shopt -s nullglob
          for cc in .nerves/artifacts/nerves_system_rg40xxv-portable-*/host/bin/ccache; do
            "$cc" --show-stats 2>/dev/null || "$cc" -s 2>/dev/null || true
          done
          du -sh ~/.buildroot-ccache 2>/dev/null || echo "no ccache directory"

      - name: Archive the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Lint the Buildroot defconfig
        # Cheap here because the system is already built; see the note above
        # for why this cannot be its own job.
        #
        # `ensure_value: BR2_GLOBAL_PATCH_DIR` is reported as a failed check and
        # that is expected: the rule wants exactly the nerves patch directory
        # while we legitimately list two, nerves' and ours. The single-argument
        # form of the task does not set a non-zero exit status, so this stays
        # advisory -- do not "fix" it by dropping our patch directory.
        #
        # Gated on having built, because the linter needs a real NERVES_SYSTEM
        # directory and there is no local one otherwise. Nothing is lost: an
        # artifact only resolves when the checksum matches, nerves_defconfig is
        # in checksum_files(), so a fetched run's defconfig is byte-identical to
        # one this job already linted when that artifact was built.
        if: steps.system.outputs.source == 'built'
        run: mix nerves.system.lint nerves_defconfig

      - name: Archive the built system
        # Only when this run actually built one.
        #
        # If deps.get resolved a published artifact, that artifact is on a
        # release already -- being downloadable is what proves it -- so there
        # is nothing here to package and nothing new to publish. Repackaging
        # a tree that was never built is at best a no-op and at worst a
        # tarball of nothing, uploaded over a good one.
        if: steps.system.outputs.source == 'built'
        run: mix nerves.artifact

      - uses: actions/upload-artifact@v4
        if: steps.system.outputs.source == 'built'
        with:
          name: nerves_system_rg40xxv
          path: "*.tar.gz"
          if-no-files-found: error

      # Publish it, so that depending on this system does not mean building
      # it. mix.exs points artifact_sites at this repository's releases, and
      # until the first release existed every `mix deps.get` in an application
      # got a 404 and fell back to a multi-hour local Buildroot build.
      #
      # The filename carries the artifact checksum, which Nerves computes from
      # checksum_files(). So a release is only useful to the exact tree that
      # produced it: change anything under linux/, fwup_include/,
      # rootfs_overlay/, uboot/, patches/, or mix.exs, nerves_defconfig,
      # REUSE.toml, VERSION -- a comment is enough -- and the next deps.get
      # looks for a checksum this asset does not have. Publishing is therefore
      # gated on a tag: a tag is the statement that this exact tree is one
      # somebody should be able to resolve. README.md and CHANGELOG.md are
      # deliberately not in that list; see checksum_files().
      #
      # The destination is derived from VERSION rather than from the tag,
      # because that is what `mix deps.get` resolves against: the
      # `:github_releases` artifact site queries `v$VERSION`, and the asset
      # filename embeds the same version. The checks job has already asserted
      # that the tag says the same thing, so this is belt and braces -- but it
      # is the half that has to be right, since a release nothing queries looks
      # exactly like a successful publish.
      - name: Work out which release the resolver reads
        id: destination
        run: echo "tag=v$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Publish the artifact to the release
        # Both conditions, not just the tag. `mix nerves.artifact` above is
        # skipped when nothing was built, so there would be no *.tar.gz to
        # attach -- and an artifact that resolved from artifact_sites is on a
        # release already, which is how it was downloadable in the first place.
        if: startsWith(github.ref, 'refs/tags/v') && steps.system.outputs.source == 'built'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.destination.outputs.tag }}
          files: "*.tar.gz"
          fail_on_unmatched_files: true
