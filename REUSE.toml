version = 1

[[annotations]]
path = [
 ".formatter.exs",
 ".github/**",
 ".gitignore",
 "CHANGELOG.md",
 "busybox/busybox.fragment",
 "nerves_defconfig",
 "REUSE.toml",
 "mix.exs",
 "mix.lock",
 "VERSION",
 "assets/bootlogo/build.sh",
 "tools/**",
 "lib/**"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "None"
SPDX-License-Identifier = "CC0-1.0"

# Prose written for this project: everything under docs/, plus the two READMEs.
# These were extracted from the README and carry its licence.
#
# `docs/**` rather than a list of names. The list existed because docs/ was
# mixed -- the design specs under docs/superpowers/ were dedicated as CC0, and a
# subtly wrong glob would have relicensed them silently. Deleting that directory
# removed the mixture, so there is no longer a wrong answer for a glob to reach.
#
# The glob is worth more than the tidiness. This file is inside
# checksum_files(), so every edit to it throws away every published artifact and
# costs a full rebuild -- which had already forced one document to carry an
# in-file SPDX header instead of an entry here. Under `docs/**` a new document
# is licensed the moment it is created, and adding prose never touches this
# file again.
[[annotations]]
path = [
 "README.md",
 "docs/**",
 "patches/buildroot/README.md"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Karl Eklund"
SPDX-License-Identifier = "CC-BY-4.0"

# Buildroot derived or related files
# NOTE: packages here proactively have copyright assigned to the Buildroot
# developers to avoid worrying about copyright assignment when upstreaming.
[[annotations]]
path = [
 "Config.in",
 "package/**",
 "external.mk",
 "post-build.sh",
 "post-createfs.sh"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "The Buildroot developers <buildroot@buildroot.org>"
SPDX-License-Identifier = "GPL-2.0-or-later"

# Linux kernel derived or related files.
#
# The board device tree is derived from the ROCKNIX/Batocera
# sun50i-h700-anbernic-rg40xx-v.dts by Philippe Simons, itself extending
# mainline work by Ryan Walklin and Chris Morgan. Dual-licensed upstream, so
# the SPDX header in the file itself is authoritative and takes precedence.
[[annotations]]
path = [
 "linux/nerves.fragment",
 "linux/linux-*.defconfig"
]
precedence = "override"
SPDX-FileCopyrightText = "Various"
SPDX-License-Identifier = "GPL-2.0-only"

# Kernel patches. Each carries its own author in its git-format-patch header;
# the display series (0100-0104) is taken from ROCKNIX, which is in turn
# carrying work by Jernej Skrabec, Philippe Simons, Ryan Walklin, Chris Morgan
# and kikuchan. Two of them are upstream submissions still in flight.
#
# `override` rather than `aggregate`, because a patch body contains the headers
# of the files it patches. 0101 adds a kernel source file that declares the
# deprecated `GPL-2.0+`, and aggregating would read that as a statement about
# the patch -- claiming an identifier that is deprecated and has no text in
# LICENSES/. What a patch payload says about kernel files is not this
# repository declaring anything.
[[annotations]]
path = [
 "patches/linux/**"
]
precedence = "override"
SPDX-FileCopyrightText = "Various kernel contributors"
SPDX-License-Identifier = "GPL-2.0-only"

# Buildroot patches, which are ours rather than inherited: they modify
# Buildroot's own linux.mk, linux/Config.in and mesa3d.mk. Attributed the same
# way as the Buildroot-derived files above -- copyright to the Buildroot
# developers under GPL-2.0-or-later -- so that upstreaming one needs no
# copyright conversation. They were covered by the kernel block until this was
# noticed, which was wrong twice over: wrong licence and wrong authors.
[[annotations]]
path = [
 "patches/buildroot/*.patch"
]
precedence = "override"
SPDX-FileCopyrightText = "The Buildroot developers <buildroot@buildroot.org>"
SPDX-License-Identifier = "GPL-2.0-or-later"

# Panel description blobs, from ROCKNIX's kernel-firmware package. These carry
# the panel timings and the controller init sequence that the generic
# panel-mipi-dpi-spi driver loads at probe time; there is no source form.
[[annotations]]
path = [
 "rootfs_overlay/lib/firmware/panels/*.panel"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "The ROCKNIX contributors"
SPDX-License-Identifier = "GPL-2.0-only"

# The boot logo strip and its four vendored source marks. Each mark keeps the
# annotation its own project uses for the identical artwork, so none of these
# are this repository's invention:
#
#  - tux.png is Larry Ewing's 1996 Tux, taken from the kernel's own
#    drivers/video/logo/logo_linux_clut224.ppm. No SPDX list identifier exists
#    for his permission notice, so it is vendored as a LicenseRef.
#  - erlang-logo128.png is copied from erlang/otp lib/wx/priv/, where Ericsson
#    annotates it Apache-2.0 in a REUSE sidecar. "ERLANG" is a trademark of
#    Telefonaktiebolaget LM Ericsson (US Reg. 4,558,297); displaying the
#    unaltered logo as nominative use is OK per Ericsson's guidance in
#    https://github.com/erlang/otp/issues/3077.
#  - elixir-drop.png is copied from elixir-lang/elixir's own documentation
#    (lib/elixir/pages/images/logo.png) -- the exact file whose upstream ORT
#    curation concludes LicenseRef-elixir-trademark-policy. The policy at
#    https://elixir-lang.org/trademarks permits using the logo "to say a
#    technology is 'powered by Elixir' under nominative use".
#  - nerves-icon.png is from https://nerves-project.org/logos/png.zip; the
#    policy at https://nerves-project.org/trademarks permits the logo to say
#    a technology is "powered by Nerves" and to display it as a supported
#    technology in a hardware device. Annotation mirrors nerves-project/nerves.
#
# bootlogo.png is the strip the kernel embeds: the four marks side by side,
# unaltered, on black. It must never be used as this project's own logo.
[[annotations]]
path = ["assets/bootlogo/tux.png"]
precedence = "aggregate"
SPDX-FileCopyrightText = "1996 Larry Ewing <lewing@isc.tamu.edu> and The GIMP"
SPDX-License-Identifier = "LicenseRef-Larry-Ewing-Tux"

[[annotations]]
path = ["assets/bootlogo/erlang-logo128.png"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Ericsson AB 2013. All Rights Reserved."
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["assets/bootlogo/elixir-drop.png"]
precedence = "aggregate"
SPDX-FileCopyrightText = "The Elixir Team"
SPDX-License-Identifier = "LicenseRef-elixir-trademark-policy"

[[annotations]]
path = ["assets/bootlogo/nerves-icon.png"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Nerves Project Authors"
SPDX-License-Identifier = "LicenseRef-Nerves-Logo"

[[annotations]]
path = ["assets/bootlogo/bootlogo.png"]
precedence = "aggregate"
SPDX-FileCopyrightText = [
  "1996 Larry Ewing <lewing@isc.tamu.edu> and The GIMP",
  "Ericsson AB 2013. All Rights Reserved.",
  "The Elixir Team",
  "Nerves Project Authors",
]
SPDX-License-Identifier = "LicenseRef-Larry-Ewing-Tux AND Apache-2.0 AND LicenseRef-elixir-trademark-policy AND LicenseRef-Nerves-Logo"

# U-Boot derived or related files
[[annotations]]
path = [
 "uboot/*"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2000-2013 Wolfgang Denk, DENX Software Engineering, wd@denx.de"
SPDX-License-Identifier = "GPL-2.0-or-later"

# Fwup config files
[[annotations]]
path = [
 "fwup-ops.conf",
 "fwup.conf",
 "fwup_include/*"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "None"
SPDX-License-Identifier = "CC0-1.0"

# Various config files
[[annotations]]
path = [
 "rootfs_overlay/etc/boardid.config",
 "rootfs_overlay/etc/erlinit.config",
 "rootfs_overlay/etc/fw_env.config",
 "rootfs_overlay/boot/extlinux/extlinux-a.conf",
 "rootfs_overlay/boot/extlinux/extlinux-b.conf",
 "rootfs_overlay/mnt/boot/.empty"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "None"
SPDX-License-Identifier = "CC0-1.0"
